name: Gold UP DOWN Telegram direction
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor.yml'
      - 'cloud_direction.py'
      - 'test_cloud_direction.py'
      - 'direction_performance.py'
      - 'test_direction_performance.py'
      - 'direction_filter.py'
      - 'test_direction_filter.py'
      - 'shadow_fifteen.py'
      - 'test_shadow_fifteen.py'
      - 'session_performance.py'
      - 'test_session_performance.py'
      - 'setup_strategy.py'
      - 'setup_watch.py'
      - 'test_setup_strategy.py'
      - 'test_signal_rules.py'
permissions:
  contents: write
concurrency:
  group: gold-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Direction delivery guards
        run: python -m unittest test_cloud_direction test_direction_performance test_direction_filter test_shadow_fifteen test_session_performance -v
      - name: Check direction and notify changes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python cloud_direction.py
      - name: Observe session entry setups (no setup messages)
        continue-on-error: true
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m unittest test_signal_rules test_setup_strategy -v
          python setup_watch.py
