name: Manual Treasury feed diagnostic
on:
  push:
    paths:
      - '.github/workflows/feed-diagnostic.yml'
      - 'feed_diagnostic.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Treasury access without sending signals
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python feed_diagnostic.py
# Reverify Treasury freshness after the 12 October cash-bond holiday: 13 October 2026.
