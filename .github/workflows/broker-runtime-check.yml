name: Read-only cloud broker runtime check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official data runtime in ephemeral runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskInstaller = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $taskInstallRoot = Join-Path $env:RUNNER_TEMP 'mt5-data-probe'
          Invoke-WebRequest -Uri 'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe?utm_campaign=download&utm_source=www.metatrader.com' -OutFile $taskInstaller
          $taskSignature = Get-AuthenticodeSignature -LiteralPath $taskInstaller
          if ($taskSignature.Status -ne 'Valid' -or $taskSignature.SignerCertificate.Subject -notmatch 'MetaQuotes') { throw 'Official installer signature not verified.' }
          $taskInstallerProcess = Start-Process -FilePath $taskInstaller -ArgumentList '/auto',('/path:'+$taskInstallRoot) -WindowStyle Hidden -PassThru
          if (-not $taskInstallerProcess.WaitForExit(180000)) { throw 'Runtime installation timed out.' }
          $taskTerminal = Join-Path $taskInstallRoot 'terminal64.exe'
          if (-not (Test-Path -LiteralPath $taskTerminal)) { throw 'Terminal executable unavailable.' }
          ('XM_TERMINAL_PATH='+$taskTerminal) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -m pip install MetaTrader5==5.0.6231
      - name: Verify runtime only; XM remains local
        env:
          BROKER_CLOUD_APPROVED: '0'
        run: python cloud_xm_probe.py
